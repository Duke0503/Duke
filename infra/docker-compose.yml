# Local development services for Duke.
# Postgres ships with pgvector (needed later for semantic memory).

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: duke-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: duke
      POSTGRES_PASSWORD: duke
      POSTGRES_DB: duke
    ports:
      - "5432:5432"
    volumes:
      - duke-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duke -d duke"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: duke-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - duke-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  duke-pgdata:
  duke-redisdata:
